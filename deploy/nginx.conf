# Include limit_req_zone in http{} and merge the locations below into the
# TLS-enabled server{} for your actual canonical domain. The loopback example
# server is for reviewing the proxy configuration, not a public TLS deployment.
# The application port must remain loopback-only; this proxy overwrites client IP input.
limit_req_zone $binary_remote_addr zone=quietspace_reports:10m rate=6r/m;
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 2k;
    client_body_timeout 10s;
    location = /api/reports {
        limit_req zone=quietspace_reports burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
